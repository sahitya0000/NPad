title = "NPad secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies and build output are not project source"
paths = [
  '''(^|/)(?:node_modules|\.git|\.build|out-npad|out-build)/''',
  '''^extensions/[^/]+/(?:dist|[^/]+-out)/''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Inherited public telemetry instrumentation identifier, not an authentication credential"
condition = "AND"
paths = ['''^extensions/(?:markdown-language-features|markdown-math|mermaid-markdown-features)/package\.json$''']
regexTarget = "line"
regexes = ['''"aiKey": "0c6ae279ed8443289764825290e4f9e2-1a736e7c-1324-4338-be46-fc2a58ae4d14-7255"''']

[[rules.allowlists]]
description = "Known keyboard shortcuts in the inherited Markdown manifest"
condition = "AND"
paths = ['''^extensions/markdown-language-features/package\.json$''']
regexTarget = "line"
regexes = ['''"key": "(?:shift\+cmd\+down|ctrl\+shift\+end|shift\+alt\+down|ctrl\+shift\+alt\+down)"''']

[[rules.allowlists]]
description = "Literal progress-token UUID in an upstream JSON protocol example"
condition = "AND"
paths = ['''^src/vs/platform/agentHost/common/state/protocol/channels-root/notifications\.ts$''']
regexTarget = "line"
regexes = ['''"progressToken": "9b2c1f7e-4a0d-4e2b-8b1a-2f7e4a0d4e2b"''']

[[rules]]
id = "private-key"

[[rules.allowlists]]
description = "Key-format detection expression, not private-key material"
condition = "AND"
paths = ['''^src/vs/platform/agentHost/node/sshRemoteAgentHostService\.ts$''']
regexTarget = "line"
regexes = ['''if \(/-----BEGIN ENCRYPTED PRIVATE KEY-----/\.test\(text\) \|\| /Proc-Type:\\s\*4,ENCRYPTED/i\.test\(text\)\) \{''']
