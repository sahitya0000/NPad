version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
      one-ds:
        patterns: ["@microsoft/1ds-*"]
    ignore:
      # Types must match the pinned Node 24 runtime; update with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 0.7+ makes SourceMapConsumer asynchronous; the bundler adjusts maps synchronously.
      - dependency-name: source-map
      # Prerelease builds track the upstream editor; Dependabot proposes downgrades.
      - dependency-name: "@vscode/codicons"
      # Only supplies CSS for math rendered by @vscode/markdown-editor's KaTeX 0.16; 0.18+ prefixes class names.
      - dependency-name: katex
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
